name: Build & Release Windows Desktop Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag version for release (e.g. v2.1.4)'
        required: false
        default: 'v2.1.4'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows 10/11 (Modern x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6

      - name: Download WebView2 Evergreen Installer for Offline Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "Daftar_Radiologi\MicrosoftEdgeWebview2Setup.exe"

      - name: Inject Dynamic App Version from Git Tag
        run: python update_version.py "${{ github.ref_name }}"

      - name: Build Windows Executable
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "Daftar_Radiologi\dist\DaftarRadiologi\*" -DestinationPath "DaftarRadiologi-v2-win10.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-Windows-Installer
          path: |
            DaftarRadiologi-v2-win10.zip

  build-legacy-windows7:
    name: Build Windows 7 (Legacy x64 - Python 3.10)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (Python 3.10 for Windows 7 / 8 Legacy Build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6

      - name: Download WebView2 Evergreen Installer for Offline Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "Daftar_Radiologi\MicrosoftEdgeWebview2Setup.exe"

      - name: Inject Dynamic App Version from Git Tag
        run: python update_version.py "${{ github.ref_name }}"

      - name: Build Windows 7 Compatible Executable
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Package Windows 7 Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "Daftar_Radiologi\dist\DaftarRadiologi\*" -DestinationPath "DaftarRadiologi-v2-win-legacy.zip" -Force

      - name: Upload Windows 7 Legacy Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-Windows7-Legacy-Installer
          path: |
            DaftarRadiologi-v2-win-legacy.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish GitHub Release
    needs: [build-windows, build-legacy-windows7]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Modern Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-Windows-Installer
          path: release_assets

      - name: Download Windows 7 Legacy Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-Windows7-Legacy-Installer
          path: release_assets

      - name: Determine Release Tag & Generate Changelog
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.1.4")
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Generate git commit changelog for current release
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline ${PREV_TAG}..HEAD | head -n 25)
          else
            CHANGES=$(git log --oneline -n 15)
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="Release build for version $TAG"
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Daftar Radiologi ${{ steps.release_info.outputs.tag }}"
          body: |
            ## Daftar Radiologi V2 (${{ steps.release_info.outputs.tag }})

            `📋 Feature Updates for version ${{ steps.release_info.outputs.tag }}:`
            ```
            ${{ steps.release_info.outputs.CHANGELOG }}
            ```

            ---

            ### 📥 Download Windows Installers (Offline Compatible)

            - **Windows 10 / Windows 11**:
              - `DaftarRadiologi-v2-win10.zip` (extract ZIP and run `DaftarRadiologi.exe`)
              
            - **Legacy Windows (Windows 7 / 8 / 8.1)**:
              - `DaftarRadiologi-v2-win-legacy.zip` (built with Python 3.10 for older Windows systems)
            
            *(Includes offline PySide6 QtWebEngine runtime fallback & auto-embed WebView2 bootstrapper for PCs with no internet connection.)*

            ---

            ### ℹ️ First-Time Launch Note

            As application binaries are distributed without a paid commercial certificate, Windows SmartScreen may show a security prompt upon first opening:
            - **Windows (SmartScreen)**: Click **More info** on the blue prompt, then select **Run anyway**.

            *(For full documentation, usage instructions, and system details, please refer to [README.md](https://github.com/rdgr-szal/daftar-radiologi-v2#readme).)*
          files: |
            release_assets/DaftarRadiologi-v2-win10.zip
            release_assets/DaftarRadiologi-v2-win-legacy.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
