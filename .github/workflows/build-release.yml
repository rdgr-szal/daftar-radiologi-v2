name: Build & Release Desktop Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag version for release (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App Bundle
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Create DMG Installer & ZIP
        run: |
          mkdir -p dist_dmg
          cp -r Daftar_Radiologi/dist/DaftarRadiologi.app dist_dmg/
          
          # Create symbolic link to Applications folder
          ln -s /Applications dist_dmg/Applications
          
          # Create DMG image
          hdiutil create -volname "Daftar Radiologi v2" -srcfolder dist_dmg -ov -format UDZO DaftarRadiologi-v2-macOS.dmg
          
          # Also package zip for direct launch
          cd Daftar_Radiologi/dist
          zip -r ../../DaftarRadiologi-v2-macOS-App.zip DaftarRadiologi.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-macOS-Installer
          path: |
            DaftarRadiologi-v2-macOS.dmg
            DaftarRadiologi-v2-macOS-App.zip

  build-windows:
    name: Build Windows (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "Daftar_Radiologi\dist\DaftarRadiologi\*" -DestinationPath "DaftarRadiologi-v2-Windows.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-Windows-Installer
          path: |
            DaftarRadiologi-v2-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-macOS-Installer
          path: release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-Windows-Installer
          path: release_assets

      - name: Determine Release Tag
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v2.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: "Daftar Radiologi ${{ steps.tag_name.outputs.tag }}"
          body: |
            ## 🚀 Daftar Radiologi V2 (${{ steps.tag_name.outputs.tag }})
            
            Sistem Pengurusan Buku Daftar Radiologi & Penjanaan Reten PHRIS KKM (PER.SS-RA 101 Compliance).
            
            ---

            ### 📥 Pakej Pemasang (Download Installers):
            - 🍏 **macOS (DMG Pemasang)**: `DaftarRadiologi-v2-macOS.dmg`
            - 🍏 **macOS (ZIP Portable)**: `DaftarRadiologi-v2-macOS-App.zip`
            - 🪟 **Windows (ZIP Executable)**: `DaftarRadiologi-v2-Windows.zip` (ekstrak dan terus dwi-klik `DaftarRadiologi.exe`)
            
            ---

            ### ⚠️ Panduan Melepasi Amaran Keselamatan Pemasangan (Security Warning Bypass):

            #### 🍏 Untuk Pengguna macOS (Gatekeeper Warning):
            Semasa membuka aplikasi kali pertama, jika keluar amaran *"App cannot be opened because it is from an unidentified developer"*:
            - **Cara 1 (Right-Click Open - Disyorkan)**:
              1. Klik kanan (**Right-Click**) atau tekan `Control` + klik pada **Daftar Radiologi.app** di dalam folder `Applications`.
              2. Pilih **Open**.
              3. Klik **Open** sekali lagi pada tetingkap pengesahan. *(macOS akan mengingati pilihan ini secara kekal)*.
            - **Cara 2 (Terminal Command)**:
              Buka Terminal dan jalankan arahan berikut:
              ```bash
              xattr -cr /Applications/DaftarRadiologi.app
              ```

            #### 🪟 Untuk Pengguna Windows 10/11 (SmartScreen Warning):
            Semasa menjalankan `DaftarRadiologi.exe`, jika keluar skrin biru *"Windows protected your PC / Unknown Publisher"*:
            1. Klik pada pautan **"More info"** (*Maklumat lanjut*).
            2. Klik butang **"Run anyway"** (*Jalankan jua*).
            3. *(Windows akan mengingati kebenaran ini dan tidak akan bertanya lagi)*.

            ---

            ### ✨ Ciri-Ciri Utama V2:
            - **Pematuhan PER.SS-RA 101**: Auto-parse MyKad/Pasport (Umur, Jantina, Warganegara) dan format tarikh seragam `DD/MM/YYYY`.
            - **Katalog SMRP & Custom Orderables**: Carian pantas & penambahan kategori jenis/bahagian pemeriksaan kustom.
            - **Dashboard Interaktif & Statistik**: Reten jenis pemeriksaan bersepadu (*Consolidated Pivot Table*), pergerakan pesakit (Jalan Kaki, Wheelchair, Trolley, RME), serta pecahan mengikut fasiliti rujukan.
            - **Reten Bulanan PHRIS**: Matriks reten 12 bulan (JAN - DIS) dengan kiraan automatik.
            - **Keselamatan Data Offline-First**: "Excel as a Database" kalis *blackout*, backup automatik harian, dan pelancar tetingkap desktop berperingkat (PyWebView & PySide6 Qt).
          files: |
            release_assets/DaftarRadiologi-v2-macOS.dmg
            release_assets/DaftarRadiologi-v2-macOS-App.zip
            release_assets/DaftarRadiologi-v2-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
