name: Build & Release Desktop Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag version for release (e.g. v2.1.3)'
        required: false
        default: 'v2.1.3'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject Dynamic App Version from Git Tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.1.3")
          fi
          echo "[AutoVersion] Injecting APP_VERSION = '$VERSION' into core/config.py"
          sed -i.bak "s/APP_VERSION = .*/APP_VERSION = \"${VERSION#v}\"/" Daftar_Radiologi/core/config.py

      - name: Build macOS App Bundle
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Create DMG Installer & ZIP
        run: |
          mkdir -p dist_dmg
          cp -r Daftar_Radiologi/dist/DaftarRadiologi.app dist_dmg/
          
          # Create symbolic link to Applications folder
          ln -s /Applications dist_dmg/Applications
          
          # Create DMG image
          hdiutil create -volname "Daftar Radiologi v2" -srcfolder dist_dmg -ov -format UDZO DaftarRadiologi-v2-mac-applesilicon.dmg
          
          # Also package zip for direct launch
          cd Daftar_Radiologi/dist
          zip -r ../../DaftarRadiologi-v2-mac-applesilicon.zip DaftarRadiologi.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-macOS-Installer
          path: |
            DaftarRadiologi-v2-mac-applesilicon.dmg
            DaftarRadiologi-v2-mac-applesilicon.zip

  build-legacy-macos:
    name: Build macOS Legacy (Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python (Python 3.10 for Intel macOS)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject Dynamic App Version from Git Tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.1.3")
          fi
          echo "[AutoVersion] Injecting APP_VERSION = '$VERSION' into core/config.py"
          sed -i.bak "s/APP_VERSION = .*/APP_VERSION = \"${VERSION#v}\"/" Daftar_Radiologi/core/config.py

      - name: Build Legacy macOS App Bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Create Legacy DMG Installer & ZIP
        run: |
          mkdir -p dist_dmg_legacy
          cp -r Daftar_Radiologi/dist/DaftarRadiologi.app dist_dmg_legacy/
          
          # Create symbolic link to Applications folder
          ln -s /Applications dist_dmg_legacy/Applications
          
          # Create DMG image
          hdiutil create -volname "Daftar Radiologi v2 Legacy 2019" -srcfolder dist_dmg_legacy -ov -format UDZO DaftarRadiologi-v2-mac-intel.dmg
          
          # Also package zip for direct launch
          cd Daftar_Radiologi/dist
          zip -r ../../DaftarRadiologi-v2-mac-intel.zip DaftarRadiologi.app

      - name: Upload Legacy macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-macOS-Legacy-Installer
          path: |
            DaftarRadiologi-v2-mac-intel.dmg
            DaftarRadiologi-v2-mac-intel.zip

  build-windows:
    name: Build Windows 10/11 (Modern x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6

      - name: Download WebView2 Evergreen Installer for Offline Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "Daftar_Radiologi\MicrosoftEdgeWebview2Setup.exe"

      - name: Inject Dynamic App Version from Git Tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -notmatch "^v") {
            $ver = (git describe --tags --abbrev=0 2>$null)
            if (-not $ver) { $ver = "v2.1.3" }
          }
          $cleanVer = $ver.TrimStart("v")
          Write-Host "[AutoVersion] Injecting APP_VERSION = '$cleanVer' into core/config.py"
          (Get-Content "Daftar_Radiologi\core\config.py") -replace 'APP_VERSION = .*', "APP_VERSION = `"$cleanVer`"" | Set-Content "Daftar_Radiologi\core\config.py"

      - name: Build Windows Executable
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "Daftar_Radiologi\dist\DaftarRadiologi\*" -DestinationPath "DaftarRadiologi-v2-win10.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-Windows-Installer
          path: |
            DaftarRadiologi-v2-win10.zip

  build-legacy-windows7:
    name: Build Windows 7 (Legacy x64 - Python 3.10)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python (Python 3.10 for Windows 7 / 8 Legacy Build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6

      - name: Download WebView2 Evergreen Installer for Offline Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "Daftar_Radiologi\MicrosoftEdgeWebview2Setup.exe"

      - name: Inject Dynamic App Version from Git Tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -notmatch "^v") {
            $ver = (git describe --tags --abbrev=0 2>$null)
            if (-not $ver) { $ver = "v2.1.3" }
          }
          $cleanVer = $ver.TrimStart("v")
          Write-Host "[AutoVersion] Injecting APP_VERSION = '$cleanVer' into core/config.py"
          (Get-Content "Daftar_Radiologi\core\config.py") -replace 'APP_VERSION = .*', "APP_VERSION = `"$cleanVer`"" | Set-Content "Daftar_Radiologi\core\config.py"

      - name: Build Windows 7 Compatible Executable
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Package Windows 7 Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "Daftar_Radiologi\dist\DaftarRadiologi\*" -DestinationPath "DaftarRadiologi-v2-win-legacy.zip" -Force

      - name: Upload Windows 7 Legacy Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-Windows7-Legacy-Installer
          path: |
            DaftarRadiologi-v2-win-legacy.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish GitHub Release
    needs: [build-macos, build-legacy-macos, build-windows, build-legacy-windows7]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS Modern Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-macOS-Installer
          path: release_assets

      - name: Download macOS Legacy Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-macOS-Legacy-Installer
          path: release_assets

      - name: Download Windows Modern Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-Windows-Installer
          path: release_assets

      - name: Download Windows 7 Legacy Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-Windows7-Legacy-Installer
          path: release_assets

      - name: Determine Release Tag & Generate Changelog
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.1.3")
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Generate git commit changelog for current release
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline ${PREV_TAG}..HEAD | head -n 25)
          else
            CHANGES=$(git log --oneline -n 15)
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="Initial release build for version $TAG"
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Daftar Radiologi ${{ steps.release_info.outputs.tag }}"
          body: |
            ## Daftar Radiologi V2 (${{ steps.release_info.outputs.tag }})

            `📋 Changelog for version ${{ steps.release_info.outputs.tag }}:`
            ```
            ${{ steps.release_info.outputs.CHANGELOG }}
            ```

            ---

            ### 📥 Download Files

            #### macOS
            - **Apple Silicon**:
              - `DaftarRadiologi-v2-mac-applesilicon.dmg` (DMG Package)
              - `DaftarRadiologi-v2-mac-applesilicon.zip` (Portable Archive)
            
              - **Intel Macs**:
              - `DaftarRadiologi-v2-mac-intel.dmg` (DMG Package)
              - `DaftarRadiologi-v2-mac-intel.zip` (Portable Archive)

            #### Windows
            - **Windows 10 / Windows 11**:
              - `DaftarRadiologi-v2-win10.zip` (extract ZIP and run `DaftarRadiologi.exe`)
              
              - **Legacy Windows (Windows 7 / 8 / 8.1)**:
              - `DaftarRadiologi-v2-win-legacy.zip` (built with Python 3.8 for older Windows systems)
            
            ---

            ### ℹ️ First-Time Launch Note

            As application binaries are distributed without a paid commercial certificate, your operating system may show a standard security prompt upon first opening:

            - **macOS (Gatekeeper)**: Right-click **Daftar Radiologi.app** in `/Applications` and select **Open**, or run `xattr -cr /Applications/DaftarRadiologi.app` in Terminal.
            - **Windows (SmartScreen)**: Click **More info** on the blue prompt, then select **Run anyway**.

            *(For full documentation, usage instructions, and system details, please refer to [README.md](https://github.com/rdgr-szal/daftar-radiologi-v2#readme).)*
          files: |
            release_assets/DaftarRadiologi-v2-mac-applesilicon.dmg
            release_assets/DaftarRadiologi-v2-mac-applesilicon.zip
            release_assets/DaftarRadiologi-v2-mac-intel.dmg
            release_assets/DaftarRadiologi-v2-mac-intel.zip
            release_assets/DaftarRadiologi-v2-win10.zip
            release_assets/DaftarRadiologi-v2-win-legacy.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

