name: Build & Release Desktop Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag version for release (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App Bundle
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Create DMG Installer & ZIP
        run: |
          mkdir -p dist_dmg
          cp -r Daftar_Radiologi/dist/DaftarRadiologi.app dist_dmg/
          
          # Create symbolic link to Applications folder
          ln -s /Applications dist_dmg/Applications
          
          # Create DMG image
          hdiutil create -volname "Daftar Radiologi v2" -srcfolder dist_dmg -ov -format UDZO DaftarRadiologi-v2-macOS.dmg
          
          # Also package zip for direct launch
          cd Daftar_Radiologi/dist
          zip -r ../../DaftarRadiologi-v2-macOS-App.zip DaftarRadiologi.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-macOS-Installer
          path: |
            DaftarRadiologi-v2-macOS.dmg
            DaftarRadiologi-v2-macOS-App.zip

  build-windows:
    name: Build Windows (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          cd Daftar_Radiologi
          pyinstaller --clean -y DaftarRadiologi.spec

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "Daftar_Radiologi\dist\DaftarRadiologi\*" -DestinationPath "DaftarRadiologi-v2-Windows.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaftarRadiologi-Windows-Installer
          path: |
            DaftarRadiologi-v2-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-macOS-Installer
          path: release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaftarRadiologi-Windows-Installer
          path: release_assets

      - name: Determine Release Tag
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v2.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: "Daftar Radiologi ${{ steps.tag_name.outputs.tag }}"
          body: |
            ## 🚀 Daftar Radiologi V2 (${{ steps.tag_name.outputs.tag }})
            
            Digital Radiology Register & PHRIS Monthly Census Management System for Ministry of Health Malaysia (KKM) Health Clinics (PER.SS-RA 101 Compliance).
            
            ---

            ### 📥 Download Installers:
            - 🍏 **macOS (DMG Installer)**: `DaftarRadiologi-v2-macOS.dmg`
            - 🍏 **macOS (ZIP Portable)**: `DaftarRadiologi-v2-macOS-App.zip`
            - 🪟 **Windows (ZIP Executable)**: `DaftarRadiologi-v2-Windows.zip` (extract zip and double-click `DaftarRadiologi.exe`)
            
            ---

            ### ⚠️ Installation Security Warning Bypass Guide:

            #### 🍏 For macOS Users (Gatekeeper Warning):
            When launching the app for the first time, if macOS displays *"App cannot be opened because it is from an unidentified developer"*:
            - **Method 1 (Right-Click Open - Recommended)**:
              1. Right-click (or `Control` + click) **Daftar Radiologi.app** inside your `/Applications` folder.
              2. Select **Open**.
              3. Click **Open** again on the confirmation prompt. *(macOS permanently remembers this decision)*.
            - **Method 2 (Terminal Command)**:
              Open Terminal and run:
              ```bash
              xattr -cr /Applications/DaftarRadiologi.app
              ```

            #### 🪟 For Windows 10/11 Users (SmartScreen Warning):
            When executing `DaftarRadiologi.exe`, if Windows displays the blue *"Windows protected your PC / Unknown Publisher"* banner:
            1. Click **"More info"**.
            2. Click **"Run anyway"**.
            3. *(Windows permanently remembers your approval and will not prompt again)*.

            ---

            ### ✨ Key Features in V2:
            - **Full PER.SS-RA 101 Compliance**: Auto-parsing of MyKad/Passport (Age, Gender, Nationality) and standardized `DD/MM/YYYY` date format.
            - **SMRP Taxonomy & Custom Orderables**: Instant search and dynamic addition of custom examination categories and anatomy sub-regions.
            - **Interactive Operational Dashboard**: Consolidated examination pivot tables, patient mobilization counts (Ambulatory, Wheelchair, Trolley, RME), and breakdowns per referring facility.
            - **Automated Monthly PHRIS Matrix**: 12-month census grid (JAN – DEC) with automatic category calculation.
            - **Offline-First Data Security**: "Excel-as-a-Database" blackout-proof architecture, automatic daily backups, and multi-tier GUI window fallback (PyWebView & PySide6 Qt).

            ---

            ### 💡 Footnote: Why This Tech Stack Was Chosen
            - **Strict KKM Data Governance (Offline-First)**: Direct write-through to local Excel (`.xlsx`) files ensures 100% offline patient data sovereignty with zero cloud dependency and direct physical audit readiness.
            - **Kalis Blackout Reliability**: Synchronous disk writing guarantees zero patient data loss during sudden power outages in health clinics.
            - **Ultra-Lightweight Footprint (PyWebView vs Electron)**: Native OS rendering keeps installer size under **~35MB** and RAM usage under **60MB**—running fast on low-spec government PCs.
            - **Multi-Tier Fail-Safe Resilience**: 3-tiered GUI launcher (PyWebView ➔ PySide6 Qt ➔ Local Browser Fallback) ensures zero application crashes even on legacy OS environments lacking pre-installed WebKit/WebView2 runtimes.
          files: |
            release_assets/DaftarRadiologi-v2-macOS.dmg
            release_assets/DaftarRadiologi-v2-macOS-App.zip
            release_assets/DaftarRadiologi-v2-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
